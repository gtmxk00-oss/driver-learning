plugins { id 'com.android.application' }
// Release keys never live in the source tree of a shared package; see keystore.properties.example.
def signing = new Properties()
def signingFile = [rootProject.file('keystore.properties'), rootProject.file('../../work/release-signing/keystore.properties')].find { it.exists() }
if (signingFile) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'kr.routememory.pleos'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.routememory.pleos'
        minSdk 29
        targetSdk 35
        versionCode 12
        versionName '0.12.0-pleos'
    }
    signingConfigs {
        release {
            if (signingFile) {
                storeFile rootProject.file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Speed and driving restrictions come from the Android Car API; optional so phones and the unit-test JVM load without it.
    useLibrary 'android.car', false
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation project(':coach')
    // Pleos Connect SDKs, all five: turn signal, gear, seats, brake, steering, wiper, lights and odometer from Vehicle;
    // turns, reroutes, destination, speed limit, trip and arrival from NaviHelper; the position and proximity alerts
    // from FusedLocation; a spoken memo or answer from SpeechToText; the companion's own voice from TextToSpeech.
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
    implementation 'ai.pleos.playground:FusedLocation:1.1.3'
    implementation 'ai.pleos.playground:SpeechToText:3.3.1'
    implementation 'ai.pleos.playground:TextToSpeech:3.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
